<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Square, simplified Chompers mark for the browser tab. The plate is
       dropped and the balls enlarged: at 16px the plate reads as noise, while
       three balls on a skewer stay recognizable. -->
  <rect width="64" height="64" rx="14" fill="#f6f9f4" />
  <line
    x1="6"
    y1="32"
    x2="58"
    y2="32"
    stroke="#c2a878"
    stroke-width="5"
    stroke-linecap="round"
  />
  <circle cx="15" cy="32" r="9" fill="#d9b354" />
  <circle cx="32" cy="32" r="9" fill="#3f5a45" />
  <circle cx="49" cy="32" r="9" fill="#b58575" />
</svg>
